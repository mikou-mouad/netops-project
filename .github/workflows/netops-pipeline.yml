---
name: NetOps Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - main
      - '*-jour*-tp*'
  pull_request:
    branches:
      - dev
      - staging
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer yamllint
        run: pip install yamllint

      - name: Lint des fichiers YAML
        run: yamllint .

  validate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la structure du projet
        run: |
          test -f docs/branching-strategy.md
          test -d roles
          test -d inventory
          echo "Structure du projet valide"

  test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Pré-checks / post-checks (placeholder)
        run: echo "Suite de tests réseau - sera complétée au Jour 3"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Déploiement (placeholder)
        run: echo "Déploiement ZDD - sera complété Jour 3 / Jour 5"
